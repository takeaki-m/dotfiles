# tmux起動時のシェルをzshにする
set-option -g default-shell /bin/zsh

# tmuxを256色表示できるようにする
set-option -g default-terminal tmux-256color
set -g terminal-overrides 'xterm:colors=256'

# 全体: CSI u エンコーディングを有効化し、Tab と Ctrl-i 等の修飾キーを区別可能にする
# 背景: 従来のターミナルでは Tab と Ctrl-i は同じバイト(0x09)を送信するため区別できない
#       CSI u エンコーディングにより、修飾キーを個別のシーケンスとして送信可能になる
# 構成: 以下の2つの設定が両方揃って初めて、Ghostty → tmux → Neovim のキーシーケンス伝達が成立する
#   extended-keys: tmux内のアプリケーション(Neovim等)が拡張キーを要求した際に、tmuxがそれに応答する
#   terminal-features: 外側のターミナル(Ghostty)が拡張キーに対応していることをtmuxに教える
#     tmuxは外側ターミナルの全機能を自動検出できないため、extkeysは明示的な宣言が必要
#     'xterm-ghostty'はGhosttyのTERM名で、tmux display -p '#{client_termname}' で確認可能
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'

# prefixキーをC-tに変更
#set -g prefix C-t
set -g prefix C-s

# C-bのキーバインドを解除
unbind C-b

# karabinerのspace + a,sでの移動に対応させるためにkeymapを定義
bind -n M-p previous-window
bind -n M-n next-window

# デフォルトはステータスバーを非表示にする
set-option -g status off
# キーバインド設定 (例: Prefix + b で表示/非表示を切り替え)
bind-key b set-option status
# ステータスバーをトップに配置する
set-option -g status-position top
#set-option -g status-position bottom

# 左右のステータスバーの長さを決定する
#set-option -g status-left-length 90
#set-option -g status-right-length 90
# 左右の領域を広く確保（左右で画面を二分するイメージ）
# 端末幅より十分大きくしておくと、実質「左半分」「右半分」を占有できます
#set -g status-left-length 100
#set -g status-right-length 100

set -g status-left-length 80
set -g status-right-length 120  # 右に十分な幅を確保
# 左: ウィンドウリストを左詰めで表示
# 現在のwindow名の反転スタイルはそのまま活かす
# window-status-format / window-status-current-format は既存設定を使用
# 左側の固定テキスト（[1]など）を削除して、プレフィックスは空にする
set -g status-left ""

# 右: ブランチ名 + 日付（シンプルに可変でもOK。幅確保で中央は動かない）
#set -g status-right '#(git -C "#{pane_current_path}" symbolic-ref --quiet --short HEAD 2>/dev/null || echo "") %Y-%m-%d(%a) %H:%M'
# パディングで中央寄せ風に（スペース数は端末幅に合わせて微調整）
#set -g status-right '          #(git -C "#{pane_current_path}" symbolic-ref --quiet --short HEAD 2>/dev/null || echo "")  %Y-%m-%d(%a) %H:%M'
# 変更前のversion
set -g status-right '#[reverse] #((git -C "#{pane_current_path}" symbolic-ref --quiet --short HEAD 2>/dev/null || echo "") | cut -c1-15) #[default]%Y-%m-%d(%a) %H:%M'
# 変更後のversion。CPU使用率・Load Average・gitブランチを表示（時刻は非表示）
# top -l 1 -s 0: 1回だけサンプリング、0秒遅延で即時取得（約1秒かかるが15秒間隔なら負荷は無視できる）
# LA形式: Load Average/CPUコア数（例: 2.58/10）- LAがコア数を超えると高負荷状態
set -g status-right 'CPU:#(top -l 1 -s 0 | grep "CPU usage" | awk "{print \$3}") LA:#(sysctl -n vm.loadavg | awk "{print \$2}")/#(sysctl -n hw.ncpu) #[reverse] #((git -C "#{pane_current_path}" symbolic-ref --quiet --short HEAD 2>/dev/null || echo "") | cut -c1-15) '
#set -g @git_branch '#(git -C "#{pane_current_path}" symbolic-ref --quiet --short HEAD 2>/dev/null || echo "")'
#set -g status-right '#[reverse] #{E:@git_branch} #[default]%Y-%m-%d(%a) %H:%M'

# 非アクティブはデフォルトのままでもOK。必要なら次のように:
# set -g window-status-format " #I:#W "
# #P => ペイン番号
# 最左に表示
# hostとprocessを表示
#set-option -g status-left '#H:[#P]'

# Wi-Fi、バッテリー残量、現在時刻
# Wi-Fi、バッテリー残量が表示されないから下の設定をコメントアウト
# 最右に表示
# set-option -g status-right "#(wifi) #(battery --tmux)[LA: #(uptime | awk -F'load averages: ' '{print $2}')] [%Y-%m-%d(%a) %H:%M]"
# set-option -g status-right "LA: #(uptime | awk -F'load averages: ' '{print $2}') | %Y-%m-%d(%a) %H:%M"

# ステータスバーを15秒毎に描画し直す（topコマンドの負荷軽減のため）
set-option -g status-interval 15


# ウィンドウリストを左寄せ（中央寄せはやめる）
set -g status-justify left
# センタライズ（主にウィンドウ番号など）
#set-option -g status-justify centre

# ステータスバーの色を設定する
#set-option -g status-bg "colour251"
#set-option -g status-bg "colour153"
#set-option -g status-bg "colour238"
set-option -g status-bg "colour247"

# status line の文字色を指定する。
set-option -g status-fg "colour232"

# アクティブなウィンドウを目立たせる
#setw -g window-status-current-style fg=white,bg=blue,bright
# ウィンドウ名の表示設定
# gitリポジトリ内ならブランチ名、そうでなければデフォルトのウィンドウ名を表示
# 非アクティブウィンドウ（ブランチ名は最大15文字に制限）
# 注意: tmux設定ファイル内では$をエスケープ(\$)、%はtmuxフォーマット文字のためcutで文字数制限
set -g window-status-format " #I:#(cd #{pane_current_path}; b=\$(git symbolic-ref --quiet --short HEAD 2>/dev/null); [ -n \"\$b\" ] && echo \"\$b\" | cut -c1-15 || echo '#W') "
# アクティブウィンドウ（反転表示、ブランチ名は最大15文字に制限）
set -g window-status-current-format "#[reverse] #I:#(cd #{pane_current_path}; b=\$(git symbolic-ref --quiet --short HEAD 2>/dev/null); [ -n \"\$b\" ] && echo \"\$b\" | cut -c1-15 || echo '#W') "
# vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# | でペインを縦分割する
bind | split-window -h

# - でペインを縦分割する
bind - split-window -v

# 番号基準値を変更
set-option -g base-index 1

# マウス操作を有効にする
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# コピーモードを設定する
# コピーモードでvimキーバインドを使う
setw -g mode-keys vi

# 'v' で選択を始める
bind -T copy-mode-vi v send -X begin-selection

# 'V' で行選択
bind -T copy-mode-vi V send -X select-line

# 'C-v' で矩形選択
bind -T copy-mode-vi C-v send -X rectangle-toggle

# 'y' でヤンク
bind -T copy-mode-vi y send -X copy-selection

# 'Y' で行ヤンク
bind -T copy-mode-vi Y send -X copy-line

# 'C-p'でペースト
bind-key C-p paste-buffer

# カスタムウィンドウ選択 (prefix + g)
# 現在のセッションのウィンドウのみを表示（prefix + w は全セッション表示）
# 表示フォーマット: ウィンドウ番号:ウィンドウ名 | パス
bind-key g choose-tree -Zw -f '#{session_attached}' -F '#(printf "%-6s │ %-42s │ %s" "#{window_index}:#{window_name}" "$(git -C "#{pane_current_path}" symbolic-ref --quiet --short HEAD 2>/dev/null || echo "-")" "#{pane_current_path}" | sed "s|$HOME|~|")'

# dotfilesディレクトリをNeovimで開く (prefix + d)
# tmux popupで独立したNeovimセッションをオーバーレイ表示する
# -E: nvim終了時にpopupを自動で閉じる
# -w/-h: 画面の80%サイズで表示（Snacks.nvimのフローティングウィンドウと同等）
bind-key f display-popup -w 80% -h 80% -E "cd ~/settings/dotfiles && nvim ."

# terminalのfocusの変更を、tmuxからcluent(neovimなど)に渡す
set -g focus-events on

# --------
# plugins
# --------

# List of plugins
# --essentials
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# --essentials

# other plugins
set -g @plugin 'sainnhe/tmux-fzf'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#run '~/.tmux/plugins/tpm/tpm'
# change default installation method with homebrew
run '$(brew --prefix tpm)/share/tpm/tpm'

TMUX_FZF_ORDER="window|pane|command|keybinding|clipboard|process|session"
