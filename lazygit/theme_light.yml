git:
  # 全体構成: diffRenderersは配列で複数のdiff表示方法を定義でき、diff画面で `|` (cycleDiffRenderers)
  #           を押すとリストを順に切り替えられる。ここでは「上下分割(unified)」と「左右分割(side-by-side)」を
  #           トグルできるよう2つ用意している。
  # 補足: 旧名はgit.pagers(配列内のキーはpager)。lazygitのバージョンアップでリネームされており、
  #       旧名のまま起動すると自動マイグレーションで設定ファイルが書き換えられるため、新しい名前で記述する。
  diffRenderers:
    # 1つ目(デフォルト): unified表示。1ファイル内で変更行を上下に並べて比較する。
    - colorArg: always
      command: delta --paging=never --syntax-theme="Monokai Extended Light"
    # 2つ目: side-by-side表示。--side-by-side で旧/新を左右2カラムに分割する。
    #         `|` キーで1つ目との間をトグルする。
    - colorArg: always
      command: delta --paging=never --side-by-side --syntax-theme="Monokai Extended Light"
gui:
  theme:
    activeBorderColor:
      - '#40a02b'
      - bold
    inactiveBorderColor:
      - '#6c6f85'
    optionsTextColor:
      - '#1e66f5'
    selectedLineBgColor:
      - '#ccd0da'
    cherryPickedCommitBgColor:
      - '#bcc0cc'
    cherryPickedCommitFgColor:
      - '#40a02b'
    unstagedChangesColor:
      - '#d20f39'
    defaultFgColor:
      - '#4c4f69'
    searchingActiveBorderColor:
      - '#df8e1d'
  authorColors:
    '*': '#7287fd'
