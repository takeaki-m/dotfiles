git:
  # 全体構成: diffRenderersは配列で複数のdiff表示方法を定義でき、diff画面で `|` (cycleDiffRenderers)
  #           を押すとリストを順に切り替えられる。ここでは「上下分割(unified)」と「左右分割(side-by-side)」を
  #           トグルできるよう2つ用意している。
  # 補足: 旧名はgit.pagers(配列内のキーはpager)。lazygitのバージョンアップでリネームされており、
  #       旧名のまま起動すると自動マイグレーションで設定ファイルが書き換えられるため、新しい名前で記述する。
  # 配色: 差分の背景色(plus/minus)は GitHub Light の差分表示色(Primer diffBlob)に合わせて直接指定している。
  #       style値の先頭の syntax は「文字色はシンタックスハイライトのまま、背景色だけ指定」の意味。
  #       command は ' で囲む。囲まないと値中の " #" 以降が YAML のコメント扱いになり切り捨てられるため。
  diffRenderers:
    # 1つ目(デフォルト): unified表示。1ファイル内で変更行を上下に並べて比較する。
    - colorArg: always
      #command: delta --paging=never --syntax-theme="Monokai Extended Light"
      command: 'delta --paging=never --syntax-theme="GitHub" --plus-style="syntax #dafbe1" --plus-emph-style="syntax #aceebb" --minus-style="syntax #ffebe9" --minus-emph-style="syntax #ffcecb"'
    # 2つ目: side-by-side表示。--side-by-side で旧/新を左右2カラムに分割する。
    #         `|` キーで1つ目との間をトグルする。
    - colorArg: always
      #command: delta --paging=never --side-by-side --syntax-theme="Monokai Extended Light"
      command: 'delta --paging=never --side-by-side --syntax-theme="GitHub" --plus-style="syntax #dafbe1" --plus-emph-style="syntax #aceebb" --minus-style="syntax #ffebe9" --minus-emph-style="syntax #ffcecb"'
