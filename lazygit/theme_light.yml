# GitHub Light テーマ
# 配色は GitHub の Primer デザインシステム(light)のカラートークンに準拠している。
gui:
  theme:
    activeBorderColor:
      - '#0969da' # accent.fg (青: フォーカス中のパネル)
      - bold
    inactiveBorderColor:
      - '#8c959f' # border/fg.subtle (グレー)
    optionsTextColor:
      - '#0969da' # accent.fg
    selectedLineBgColor:
      - '#ddf4ff' # accent.subtle (選択行の背景)
    cherryPickedCommitBgColor:
      - '#d0d7de' # border.default
    cherryPickedCommitFgColor:
      - '#0969da' # accent.fg
    unstagedChangesColor:
      - '#cf222e' # danger.fg (赤)
    defaultFgColor:
      - '#1f2328' # fg.default
    searchingActiveBorderColor:
      - '#9a6700' # attention.fg (黄)
    # authorColors は gui.theme ではなく gui 直下のキー
    authorColors:
      '*': '#8250df' # done.fg (紫)
