gui:
  nerdFontsVersion: "3"
  # If true, increase the height of the focused side window; creating an accordion
  # effect.
  # フォーカスしたパネルを拡大
  expandFocusedSidePanel: true
  # The weight of the expanded side panel, relative to the other panels. 2 means
  # twice as tall as the other panels. Only relevant if `expandFocusedSidePanel`
  # is true.
  # 通常時のサイドバー比率を小さく
  expandedSidePanelWeight: 2
  mainPanelSplitMode: flexible
  enlargedSideViewLocation: 'top'
git:
  # diff表示の前後に含めるコンテキスト行数(git diffの -U <n> に相当)
  # 既定の3行では変更行の周辺しか見えずレビューしづらいため広げている。
  # `{`/`}`(decrease/increaseContextInDiffView)でも変更できるが、その値は保存されず
  # lazygitを起動するたびに既定値へ戻るため、常用する値はここで指定する
  # なお同じgitキーをtheme_light.yml/theme_dark.yml側でも使っているが、
  # 複数の設定ファイルはキー単位でマージされるため上書きは発生しない
  diffContextSize: 7
customCommands:
  # Conventional Commitをメニュー選択式で組み立てるカスタムコマンド
  # type選択 → scope入力(任意) の後、エディタが開きコミットメッセージを自由に記述可能
  # エディタでは空行を挟んでdetail（補足説明）も記述できる
  #
  # commandの処理フロー:
  #   1. /tmp/.lzg_ed にGIT_EDITOR用のラッパースクリプトを生成
  #   2. ラッパーをGIT_EDITORに設定し git commit -v を実行
  #   3. gitがラッパーを呼び出し、sedでCOMMIT_EDITMSGの1行目にプレフィックス（例: "feat: "）を挿入
  #   4. $EDITORでファイルを開く（末尾スペースが保持される）
  #   5. 保存後、gitのデフォルト cleanup=strip が #コメント行（-v のdiff等）を自動除去
  #
  # なぜGIT_EDITORラッパーが必要か:
  #   git commit -m でプレフィックスを渡すと、gitのstripspaceが末尾スペースを除去してしまう。
  #   ラッパー経由でCOMMIT_EDITMSGを直接編集することで、gitのメッセージ処理をバイパスする。
  - key: "V"
    context: "files"
    command: 'printf ''#!/bin/sh\nsed -i "" "1s/^/{{.Form.Type}}{{if .Form.Scope}}({{.Form.Scope}}){{end}}: /" "$1"\n${EDITOR:-nvim} "$1"\n'' > /tmp/.lzg_ed && chmod +x /tmp/.lzg_ed && GIT_EDITOR=/tmp/.lzg_ed git commit -v'
    description: "Conventional commit"
    prompts:
      - type: "menu"
        key: "Type"
        title: "Commit type"
        options:
          - name: "feat"
            description: "新機能"
            value: "feat"
          - name: "fix"
            description: "バグ修正"
            value: "fix"
          - name: "docs"
            description: "ドキュメント"
            value: "docs"
          - name: "style"
            description: "コードスタイル"
            value: "style"
          - name: "refactor"
            description: "リファクタリング"
            value: "refactor"
          - name: "perf"
            description: "パフォーマンス改善"
            value: "perf"
          - name: "test"
            description: "テスト"
            value: "test"
          - name: "build"
            description: "ビルド関連"
            value: "build"
          - name: "ci"
            description: "CI設定"
            value: "ci"
          - name: "chore"
            description: "雑務"
            value: "chore"
          - name: "revert"
            description: "変更の取り消し"
            value: "revert"
      - type: "input"
        key: "Scope"
        title: "Scope (任意、空欄可)"
    # commit messageの入力を外部エディタで行うための設定
    output: terminal
keybinding:
  # カーソル移動のc-pと競合するため、以下の通りに設定
  universal:
    createPatchOptionsMenu: <f12>
    # universal.removeはfilesパネルのdiscard、branchesパネルの削除など全パネル共通の削除操作キー
    # ctrl-dスクロール時にctrlが外れてdが単独入力され、
    # 変更がdiscardされる誤操作を防止するためにd→D(Shift+D)に変更
    remove: "D"
    # diff表示のスクロールキーをvimの意味論に合わせるための置き換え
    # lazygitのmain windowのスクロール量はgui.scrollHeight(既定2行)の固定値であり、
    # vimのctrl-d/ctrl-u(半ページ)ではなくctrl-e/ctrl-y(1行スクロール)に相当する挙動になる。
    # キー名と実挙動のずれをなくすため、alt2の割り当てをctrl-e/ctrl-yへ変更する。
    # なお大きく移動したい場合は"0"(focusMainView)でdiffにフォーカスし、","/"."のページ送りを使う
    scrollDownMain-alt2: <ctrl+e>
    scrollUpMain-alt2: <ctrl+y>
  # commitChangesはデフォルトの"c"、commitChangesWithEditorはデフォルトの"C"のまま
  # Conventional Commitカスタムコマンドは"V"に割り当て
  # パネル固有のキーはuniversalの同名キーより優先される。
  # そのためbranchesパネルで<ctrl+y>を上スクロールに使うには、
  # デフォルトの割り当て(copyPullRequestURL)を解除しておく必要がある
  branches:
    # PRのURLはO(PRオプション)やG(ブラウザで開く)から辿れるため、無効化しても代替手段はある
    copyPullRequestURL: <disabled>
