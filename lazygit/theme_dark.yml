git:
  # 全体構成: pagersは配列で複数のpagerを定義でき、diff画面で `|` (cyclePagers) を押すと
  #           リストを順に切り替えられる。ここでは「上下分割(unified)」と「左右分割(side-by-side)」を
  #           トグルできるよう2つ用意している。
  pagers:
    # 1つ目(デフォルト): unified表示。1ファイル内で変更行を上下に並べて比較する。
    - colorArg: always
      pager: delta --paging=never --syntax-theme="Monokai Extended Bright"
    # 2つ目: side-by-side表示。--side-by-side で旧/新を左右2カラムに分割する。
    #         `|` キーで1つ目との間をトグルする。
    - colorArg: always
      pager: delta --paging=never --side-by-side --syntax-theme="Monokai Extended Bright"
gui:
  theme:
    activeBorderColor:
      - '#a7c080'  # 緑系（フォレストの葉）
      - bold
    inactiveBorderColor:
      - '#7a8478'  # グレイッシュグリーン
    optionsTextColor:
      - '#7fbbb3'  # アクアブルー
    selectedLineBgColor:
      - '#3d484d'  # 暗めの背景（選択時）
    cherryPickedCommitBgColor:
      - '#475258'  # やや明るいグレー
    cherryPickedCommitFgColor:
      - '#a7c080'  # 緑系
    unstagedChangesColor:
      - '#e67e80'  # 柔らかい赤（エラー/変更）
    defaultFgColor:
      - '#d3c6aa'  # クリーム系の文字色
    searchingActiveBorderColor:
      - '#dbbc7f'  # 黄色系（検索時の強調）

  authorColors:
    '*': '#7fbbb3'  # アクアブルー
 
