# GitHub Dark テーマ
# 配色は GitHub の Primer デザインシステム(dark default)のカラートークンに準拠している。
gui:
  theme:
    activeBorderColor:
      - '#58a6ff' # accent.fg (青: フォーカス中のパネル)
      - bold
    inactiveBorderColor:
      - '#8b949e' # fg.muted (グレー)
    optionsTextColor:
      - '#58a6ff' # accent.fg
    selectedLineBgColor:
      - '#30363d' # border.default (選択行の背景)
    cherryPickedCommitBgColor:
      - '#0d419d' # accent.subtle 相当の濃い青
    cherryPickedCommitFgColor:
      - '#58a6ff' # accent.fg
    unstagedChangesColor:
      - '#f85149' # danger.fg (赤)
    defaultFgColor:
      - '#e6edf3' # fg.default
    searchingActiveBorderColor:
      - '#d29922' # attention.fg (黄)
    # authorColors は gui.theme ではなく gui 直下のキー
    authorColors:
      '*': '#bc8cff' # done.fg (紫)
