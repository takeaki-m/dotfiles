network_access = true

# モデル設定方針（全体方針）:
# - デフォルトでは固定せず、CLIの既定選択（最新追従）を利用する
# - reasoning effort も固定せず、タスクに応じた自動調整を優先する

# 権限設計（全体方針）:
# - 通常起動は最小権限を適用し、read-only を既定値にする
# - 変更作業が必要な場合のみ、明示的に profile(write) で昇格する
sandbox_mode = "read-only"
approval_policy = "untrusted"

# 権限設計（詳細）:
# - `codex -p write` のときだけ workspace-write を有効化する
[profiles.write]
sandbox_mode = "workspace-write"
approval_policy = "untrusted"


notify = ["osascript", "-e", "display notification \"Task Complete!!!\" with title \"Codex\" subtitle \"Processing is complete.\" sound name \"Pop\""]


[tui]
#　デスクトップ通知に関する設定
# - "agent-turn-complete": エージェントの１ターン処理が完了した際に通知
# - "approval-requested": ユーザーの操作や承認が必要な時に通知
notifications = ["agent-turn-complete","approval-requested"]

[tools]
web_search_request = true

[mcp_servers.awslabs_aws-documentation]
command = "/opt/homebrew/bin/uvx"
args = ["awslabs.aws-documentation-mcp-server@latest"]

[mcp_servers.mui-mcp]
command = "npx"
args = [ "-y", "@mui/mcp@latest" ]

[mcp_servers.docker]
command = "docker"
args = [ "run", "-i", "--rm", "hashicorp/terraform-mcp-server" ]

[mcp_servers.context7]
args = ["-y", "@upstash/context7-mcp"]
command = "npx"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]
