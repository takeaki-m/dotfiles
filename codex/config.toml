network_access = true

model = "gpt-5-codex"
model_reasoning_effort = "high"


notify = ["osascript", "-e", "display notification \"Task Complete!!!\" with title \"Codex\" subtitle \"Processing is complete.\" sound name \"Pop\""]


[tui]
#　デスクトップ通知に関する設定
# - "agent-turn-complete": エージェントの１ターン処理が完了した際に通知
# - "approval-requested": ユーザーの操作や承認が必要な時に通知
notifications = ["agent-turn-complete","approval-requested"]

[tools]
web_search = true

[mcp_servers.awslabs_aws-documentation]
command = "/opt/homebrew/bin/uvx"
args = ["awslabs.aws-documentation-mcp-server@latest"]

[mcp_servers.mui-mcp]
command = "npx"
args = [ "-y", "@mui/mcp@latest" ]

[mcp_servers.docker]
command = "docker"
args = [ "run", "-i", "--rm", "hashicorp/terraform-mcp-server" ]

[mcp_servers.context7]
args = ["-y", "@upstash/context7-mcp"]
command = "npx"
